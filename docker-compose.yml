version: '3.8'

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: cloudpanel-backend
    container_name: cloudpanel-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - cloudpanel-websites:/srv/cloudpanel/websites
    environment:
      APP_ENV: local
      APP_DEBUG: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: cloudpanel
      DB_USERNAME: cloudpanel
      DB_PASSWORD: cloudpanel_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - postgres
      - redis

  web:
    image: nginx:alpine
    container_name: cloudpanel-nginx
    restart: unless-stopped
    ports:
      - '8000:80'
    volumes:
      - ./backend:/var/www
      - ./nginx/cloudpanel-dev.conf:/etc/nginx/conf.d/default.conf
      - cloudpanel-websites:/srv/cloudpanel/websites
    depends_on:
      - app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudpanel-frontend
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

  postgres:
    image: postgres:16-alpine
    container_name: cloudpanel-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: cloudpanel
      POSTGRES_USER: cloudpanel
      POSTGRES_PASSWORD: cloudpanel_password
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: cloudpanel-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
  cloudpanel-websites:
